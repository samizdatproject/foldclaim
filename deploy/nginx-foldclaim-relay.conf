# nginx for the FoldClaim demo relayer on its own subdomain (placeholder foldclaim.cls9.com), proxied to the relay on
# 127.0.0.1:8792. See deploy/README-relay.md for the certbot steps.

# --- http {} context: /etc/nginx/conf.d/foldclaim-relay-zones.conf (once per server) ---
# Per client: 30 requests/minute. IPv6 caveat: $binary_remote_addr keys an IPv6 client per address (/128), so one
# client with a /64 has 2^64 keys. We publish no AAAA record for the relay, so clients arrive over IPv4. If an AAAA
# record is ever added, key this zone by /64 as well (the relay itself already keys IPv6 clients by /64).
limit_req_zone $binary_remote_addr zone=foldclaim_relay:10m rate=30r/m;
# Global: 20 POSTs/minute across all clients (only POSTs have a non-empty key; an empty key is not counted).
map $request_method $foldclaim_post_key {
    POST    "claim";
    default "";
}
limit_req_zone $foldclaim_post_key zone=foldclaim_claims:1m rate=20r/m;
# Per client POSTs: 5/minute, so one client cannot use up the global budget and lock everyone out.
map $request_method $foldclaim_post_ip {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $foldclaim_post_ip zone=foldclaim_post_ip:10m rate=5r/m;
limit_conn_zone $binary_remote_addr zone=foldclaim_conn:10m;

# --- /etc/nginx/sites-available/foldclaim-relay ---
server {
    listen 80;
    listen [::]:80;     # harmless without an AAAA record; see the IPv6 caveat above before adding one
    server_name foldclaim.cls9.com;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name foldclaim.cls9.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/foldclaim.cls9.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/foldclaim.cls9.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 4k;
    client_header_timeout 10s;
    client_body_timeout 10s;
    access_log /var/log/nginx/foldclaim-relay.access.log;

    # The relay is an API only; send people who open the bare host to the demo page.
    location = / { return 302 https://samizdatproject.github.io/foldclaim/; }

    location / {
        limit_req zone=foldclaim_relay burst=10 nodelay;
        limit_req zone=foldclaim_post_ip burst=3 nodelay;
        limit_req zone=foldclaim_claims burst=10 nodelay;
        limit_req_status 429;
        limit_conn foldclaim_conn 10;
        limit_conn_status 429;
        error_page 429 = @foldclaim_rate_limited;

        proxy_pass http://127.0.0.1:8792;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append): the relay takes the last X-Forwarded-For hop as the client (TRUST_PROXY=1).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;    # the relay bounds a claim at 90 s
    }

    # nginx's own 429 as JSON with the CORS header, so the page can show the reason. add_header here replaces the
    # server-level one, so HSTS is repeated.
    location @foldclaim_rate_limited {
        default_type application/json;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Access-Control-Allow-Origin https://samizdatproject.github.io always;
        add_header Vary Origin always;
        return 429 '{"error":"rate limited"}';
    }
}

